<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090b18">
<title>热血格斗 · 在线对决</title>
<style>
:root{--cyan:#43e8ff;--pink:#ff4f9a;--bg:#090b18}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#20274a 0,#090b18 62%);color:#f5f7ff;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;min-height:100vh;touch-action:manipulation}.wrap{max-width:1000px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.brand{font-weight:1000;letter-spacing:1px;font-size:clamp(20px,4vw,30px);text-shadow:0 0 20px #43e8ff55}.brand span{color:var(--cyan)}.pill{border:1px solid #ffffff20;background:#ffffff0c;border-radius:999px;padding:7px 12px;font-size:12px;color:#c7cee9}.panel{margin-top:14px;background:#11152acc;border:1px solid #ffffff1a;border-radius:20px;padding:14px;box-shadow:0 20px 70px #0006}.lobby{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{width:100%;background:#080b18;border:1px solid #ffffff25;border-radius:12px;color:white;padding:13px;font-size:16px;outline:none}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:900;font-size:15px;color:#061019;background:linear-gradient(135deg,var(--cyan),#8bfbff);box-shadow:0 6px 20px #43e8ff20;cursor:pointer}.btn.pink{background:linear-gradient(135deg,#ff4f9a,#ff9fcb);color:#230817}.btn.ghost{background:#ffffff12;color:#f4f6ff;border:1px solid #ffffff20;box-shadow:none}.btn:disabled{opacity:.4}.status{font-size:13px;color:#aab4d5;margin-top:10px;min-height:20px}.arena{position:relative;margin-top:14px;border-radius:18px;overflow:hidden;border:1px solid #ffffff25;background:#080b18}.arena canvas{display:block;width:100%;height:auto;aspect-ratio:900/410}.hud{position:absolute;top:12px;left:12px;right:12px;display:grid;grid-template-columns:1fr 1fr;gap:18px;pointer-events:none}.hudside:last-child{text-align:right}.name{font-size:12px;font-weight:900;margin-bottom:5px}.bar{height:13px;background:#ffffff18;border:1px solid #ffffff35;border-radius:999px;overflow:hidden}.fill{height:100%;width:100%;transition:width .12s}.fill.one{background:linear-gradient(90deg,#20b6ff,#7ef7ff)}.fill.two{background:linear-gradient(90deg,#ff4b94,#ffb1d3)}.energy{height:5px;margin-top:4px;background:#ffffff14;border-radius:9px;overflow:hidden}.energy>div{height:100%;background:#ffe66b;width:0}.mid{position:absolute;top:54px;left:50%;transform:translateX(-50%);font-weight:1000;letter-spacing:3px;color:#ffffff9c;text-shadow:0 0 14px #fff8}.result{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#070916b8;backdrop-filter:blur(4px);text-align:center}.result.show{display:flex}.result h2{font-size:clamp(30px,8vw,52px);margin:0 0 8px;text-shadow:0 0 22px #43e8ff}.result p{margin:0 0 18px;color:#d7def8}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.control-side{border:1px solid #ffffff1a;background:#ffffff06;border-radius:16px;padding:10px}.control-title{font-size:12px;font-weight:900;margin:0 0 8px;color:#bdc6e7}.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.key{min-height:58px;border-radius:13px;border:1px solid #ffffff24;background:linear-gradient(180deg,#242a47,#12172d);color:white;font-size:20px;font-weight:900;touch-action:none;user-select:none;-webkit-user-select:none}.key:active,.key.down{background:linear-gradient(180deg,#24556b,#183247);border-color:var(--cyan);box-shadow:0 0 15px #43e8ff45}.key.attack{font-size:14px;background:linear-gradient(180deg,#3a203e,#20162e)}.key.special{background:linear-gradient(180deg,#59491e,#302613);color:#ffe66b}.key.blank{visibility:hidden}.smallprint{font-size:12px;color:#8e99bf;line-height:1.6;margin:12px 2px 4px}.online-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffbd4a;margin-right:6px}.online-dot.ok{background:#4df0a6;box-shadow:0 0 8px #4df0a6}.footer{font-size:11px;color:#707b9e;text-align:center;margin:15px 0 6px}@media(max-width:600px){.wrap{padding:9px}.panel{padding:10px;border-radius:16px}.lobby{grid-template-columns:1fr}.controls{gap:7px}.control-side{padding:7px}.key{min-height:54px;font-size:18px}.key.attack{font-size:12px}.hud{left:8px;right:8px;top:8px;gap:8px}.name{font-size:10px}.bar{height:10px}.mid{top:43px;font-size:12px}.arena canvas{aspect-ratio:900/430}.btn{padding:12px}.brand{font-size:20px}}
</style>
</head>
<body><div class="wrap">
<header class="top"><div class="brand">热血<span>格斗</span> <span style="color:#fff;font-size:12px;letter-spacing:2px">ONLINE</span></div><div class="pill"><i class="online-dot" id="dot"></i><span id="connection">正在连接服务器…</span></div></header>
<section class="panel"><div class="lobby" id="lobby"><button class="btn" id="create">⚡ 创建对战房间</button><div style="display:flex;gap:8px"><input class="field" id="roomInput" maxlength="5" placeholder="输入好友房间号" autocapitalize="characters"><button class="btn pink" id="join">加入</button></div></div><div class="status" id="status">创建房间后，把房间号或网页链接发给好友。双方都需要联网打开此页面。</div></section>
<section class="arena"><canvas id="game" width="900" height="410" aria-label="格斗游戏画面"></canvas><div class="hud"><div class="hudside"><div class="name">PLAYER 1 · <span id="p1hp">100</span> HP</div><div class="bar"><div class="fill one" id="hp1"></div></div><div class="energy"><div id="en1"></div></div></div><div class="hudside"><div class="name">PLAYER 2 · <span id="p2hp">100</span> HP</div><div class="bar"><div class="fill two" id="hp2"></div></div><div class="energy"><div id="en2"></div></div></div></div><div class="mid">VS</div><div class="result" id="result"><h2 id="resultTitle">PLAYER 1 WIN</h2><p id="resultText">再来一局？</p><button class="btn" id="rematch">再战一局</button></div></section>
<section class="controls"><div class="control-side"><p class="control-title" style="color:var(--cyan)">PLAYER 1 · 左侧玩家</p><div class="pad" data-player="1"><button class="key blank" tabindex="-1"></button><button class="key" data-action="jump">跳跃 ↑</button><button class="key blank" tabindex="-1"></button><button class="key" data-action="left">◀</button><button class="key" data-action="right">▶</button><button class="key attack" data-action="punch">拳击</button><button class="key attack" data-action="kick">踢击</button><button class="key special" data-action="special">必杀 ✦</button><button class="key blank" tabindex="-1"></button></div></div><div class="control-side"><p class="control-title" style="color:var(--pink)">PLAYER 2 · 右侧玩家</p><div class="pad" data-player="2"><button class="key blank" tabindex="-1"></button><button class="key" data-action="jump">跳跃 ↑</button><button class="key blank" tabindex="-1"></button><button class="key" data-action="left">◀</button><button class="key" data-action="right">▶</button><button class="key attack" data-action="punch">拳击</button><button class="key attack" data-action="kick">踢击</button><button class="key special" data-action="special">必杀 ✦</button><button class="key blank" tabindex="-1"></button></div></div></section>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn ghost" id="copy">复制邀请链接</button><button class="btn ghost" id="leave">离开房间</button></div>
<p class="smallprint">玩法：方向键移动，跳跃躲避，拳击/踢击造成伤害；能量条满后可释放必杀技。手机请按住方向键移动，点击攻击键出招。必须先创建或加入同一房间才能开始对战。</p><div class="footer">多人同步由服务器协调 · 请勿在同一房间重复加入</div></div>
<script src="/socket.io/socket.io.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id), canvas=$('game'),ctx=canvas.getContext('2d');
const socket=io({transports:['websocket','polling']});let mySlot=0,roomCode='',latest=null,keys={},lastInput='',started=false;
const status=t=>$('status').textContent=t;
socket.on('connect',()=>{$('dot').classList.add('ok');$('connection').textContent='网络已连接';});
socket.on('disconnect',()=>{$('dot').classList.remove('ok');$('connection').textContent='连接中断';status('与服务器断开连接，请刷新页面重试。');});
socket.on('connect_error',()=>{$('connection').textContent='无法连接';status('暂时无法连接服务器。请确认游戏已部署到支持 Node.js 的网络服务器，而不是直接打开本地 HTML 文件。');});
$('create').onclick=()=>socket.emit('createRoom',{},res=>{if(!res?.ok)return;roomCode=res.code;mySlot=res.slot;$('roomInput').value=roomCode;status('房间已创建：'+roomCode+'。点击“复制邀请链接”发送给好友，等待对方加入。');history.replaceState(null,'',location.pathname+'?room='+roomCode);});
$('join').onclick=()=>{const code=$('roomInput').value.trim().toUpperCase();if(!code)return status('请先输入好友的 5 位房间号。');socket.emit('joinRoom',code,res=>{if(!res?.ok)return status(res?.error||'加入失败');roomCode=res.code;mySlot=res.slot;status('已加入房间 '+roomCode+'，正在同步战斗…');history.replaceState(null,'',location.pathname+'?room='+roomCode);});};
$('copy').onclick=async()=>{if(!roomCode){status('请先创建或加入房间。');return}const url=location.origin+location.pathname+'?room='+roomCode;try{await navigator.clipboard.writeText(url);status('邀请链接已复制：发给好友即可加入房间 '+roomCode+'。')}catch(e){prompt('复制下面的邀请链接：',url)}};
$('leave').onclick=()=>{location.href=location.pathname};
socket.on('state',s=>{latest=s;if(s.players.some(p=>p.id===socket.id)){const me=s.players.find(p=>p.id===socket.id);mySlot=me.slot;roomCode=s.code;} updateHUD(s);draw(s);if(s.status==='waiting')status('房间 '+s.code+' · 等待好友加入（把房间号发给好友）。');else if(s.status==='playing')status('房间 '+s.code+' · 正在对战！');if(s.status!=='finished')$('result').classList.remove('show');});
socket.on('notice',t=>status(t));socket.on('roundOver',r=>{$('resultTitle').textContent='PLAYER '+r.winner+' WIN!';$('resultText').textContent=r.winner===mySlot?'你赢了！保持连击。':'本局结束，再试一次！';$('result').classList.add('show')});$('rematch').onclick=()=>socket.emit('rematch');
function updateHUD(s){for(let n=1;n<=2;n++){const p=s.players.find(x=>x.slot===n);const hp=p?p.hp:100,en=p?p.energy:0;$('hp'+n).style.width=hp+'%';$('p'+n+'hp').textContent=Math.ceil(hp);$('en'+n).style.width=en+'%';}}
const input={left:false,right:false,jump:false,punch:false,kick:false,special:false};let pulse={};
function send(){const str=JSON.stringify(input);if(str!==lastInput){socket.emit('input',input);lastInput=str}}
function setAction(action,on){if(!(action in input))return;if(['punch','kick','special','jump'].includes(action)){if(on){input[action]=true;send();setTimeout(()=>{input[action]=false;send()},110)}return}input[action]=on;send()}
document.querySelectorAll('.pad').forEach(pad=>{pad.querySelectorAll('[data-action]').forEach(btn=>{const action=btn.dataset.action;let down=false;const start=e=>{e.preventDefault();if(down)return;down=true;btn.classList.add('down');setAction(action,true)};const end=e=>{if(e)e.preventDefault();if(!down)return;down=false;btn.classList.remove('down');if(action==='left'||action==='right')setAction(action,false)};btn.addEventListener('pointerdown',start);['pointerup','pointercancel','pointerleave'].forEach(ev=>btn.addEventListener(ev,end));});});
const keyMap={KeyA:[1,'left'],KeyD:[1,'right'],KeyW:[1,'jump'],KeyF:[1,'punch'],KeyG:[1,'kick'],KeyH:[1,'special'],ArrowLeft:[2,'left'],ArrowRight:[2,'right'],ArrowUp:[2,'jump'],Digit1:[2,'punch'],Digit2:[2,'kick'],Digit3:[2,'special']};
window.addEventListener('keydown',e=>{const map=keyMap[e.code];if(!map)return;e.preventDefault();if(mySlot&&map[0]!==mySlot)return;if(e.repeat&&['jump','punch','kick','special'].includes(map[1]))return;keys[e.code]=true;setAction(map[1],true)});window.addEventListener('keyup',e=>{const map=keyMap[e.code];if(!map)return;keys[e.code]=false;if(map[1]==='left'||map[1]==='right')setAction(map[1],false)});
// Draw a self-contained stylized arena; server remains the source of truth for positions and damage.
function rounded(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(s){ctx.clearRect(0,0,900,410);let g=ctx.createLinearGradient(0,0,0,410);g.addColorStop(0,'#171b39');g.addColorStop(.62,'#28213d');g.addColorStop(1,'#0b0e1c');ctx.fillStyle=g;ctx.fillRect(0,0,900,410);
// moon and skyline
ctx.fillStyle='#d8faff';ctx.globalAlpha=.65;ctx.beginPath();ctx.arc(730,82,33,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
for(let i=0;i<20;i++){const x=i*48-6,h=50+((i*37)%100);ctx.fillStyle=i%2?'#202544':'#171d38';ctx.fillRect(x,205-h,39,h);for(let j=0;j<3;j++)for(let k=0;k<Math.floor(h/17);k++){ctx.fillStyle=(i+j+k)%4===0?'#5de6ff44':'#ff62ad20';ctx.fillRect(x+6+j*10,214-h+k*15,4,5)}}
ctx.strokeStyle='#43e8ff30';ctx.lineWidth=1;for(let y=285;y<410;y+=23){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(900,y);ctx.stroke()}for(let x=-400;x<1300;x+=75){ctx.beginPath();ctx.moveTo(450,270);ctx.lineTo(x,410);ctx.stroke()}
ctx.fillStyle='#090c19';ctx.fillRect(0,300,900,110);ctx.fillStyle='#43e8ff';ctx.globalAlpha=.65;ctx.fillRect(0,300,900,2);ctx.globalAlpha=1;
if(!s||!s.players.length){ctx.textAlign='center';ctx.fillStyle='#e8f5ff';ctx.font='bold 28px system-ui';ctx.fillText('创建房间 · 邀请好友 · 开始对决',450,235);ctx.font='16px system-ui';ctx.fillStyle='#8e9ac3';ctx.fillText('等待两位玩家连接',450,265);return}
for(const p of s.players)drawFighter(p);
ctx.textAlign='center';ctx.font='bold 11px system-ui';ctx.fillStyle='#c8d1f4';ctx.fillText(s.status==='playing'?'FIGHT!':s.status==='finished'?'ROUND OVER':'WAITING FOR CHALLENGER',450,365);
}
function drawFighter(p){const x=p.x,y=300+p.y,dir=p.facing;ctx.save();ctx.translate(x,y);ctx.scale(dir,1);ctx.shadowBlur=18;ctx.shadowColor=p.color;
// shadow
ctx.shadowBlur=0;ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(0,3,34,8,0,0,Math.PI*2);ctx.fill();
// special aura
if(p.attack?.type==='special'){ctx.globalAlpha=.35;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(0,-57,60+Math.sin(Date.now()/35)*6,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
// legs
ctx.strokeStyle='#15182a';ctx.lineWidth=14;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-9,-30);ctx.lineTo(-15,-5);ctx.moveTo(9,-30);ctx.lineTo(15,-5);ctx.stroke();ctx.strokeStyle=p.color;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-10,-26);ctx.lineTo(-16,-5);ctx.moveTo(10,-26);ctx.lineTo(16,-5);ctx.stroke();
// torso
ctx.shadowBlur=12;ctx.shadowColor=p.color;rounded(-20,-79,40,48,11,p.color);ctx.shadowBlur=0;rounded(-13,-73,26,32,7,'#161b31');ctx.fillStyle=p.color;ctx.fillRect(-17,-58,34,4);
// neck and head
ctx.fillStyle='#dcae91';ctx.fillRect(-6,-88,12,12);ctx.fillStyle='#f0c4a5';ctx.beginPath();ctx.arc(0,-98,17,0,Math.PI*2);ctx.fill();ctx.fillStyle='#17192b';ctx.beginPath();ctx.arc(0,-104,18,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(-17,-104,8,10);ctx.fillStyle='#fff';ctx.fillRect(5,-100,6,3);ctx.fillStyle='#111';ctx.fillRect(9,-100,3,3);
// arms and attack pose
ctx.strokeStyle='#dcae91';ctx.lineWidth=10;ctx.lineCap='round';let ax=23,ay=-65;if(p.attack){if(p.attack.type==='punch'){ax=40;ay=-69}else if(p.attack.type==='kick'){ax=19;ay=-67}else{ax=46;ay=-72}}ctx.beginPath();ctx.moveTo(15,-72);ctx.lineTo(ax,ay);ctx.stroke();ctx.strokeStyle=p.color;ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(15,-72);ctx.lineTo(ax-3,ay);ctx.stroke();ctx.fillStyle='#f0c4a5';ctx.beginPath();ctx.arc(ax,ay,7,0,Math.PI*2);ctx.fill();
if(p.attack?.type==='kick'){ctx.strokeStyle=p.color;ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(5,-33);ctx.lineTo(48,-24);ctx.stroke()}if(p.attack?.type==='special'){ctx.fillStyle=p.color;ctx.globalAlpha=.9;ctx.beginPath();ctx.arc(54,-70,18+Math.sin(Date.now()/30)*5,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
ctx.restore();ctx.textAlign='center';ctx.font='bold 11px system-ui';ctx.fillStyle=p.color;ctx.fillText(p.slot===1?'P1':'P2',p.x, p.y+300-126);
}
const initialRoom=new URLSearchParams(location.search).get('room');if(initialRoom){$('roomInput').value=initialRoom.toUpperCase();setTimeout(()=>$('join').click(),700)}draw(null);
})();
</script></body></html>
